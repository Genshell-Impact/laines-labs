<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaTech Labs - Document Archive</title>
<meta name="description" content="NovaTech Labs document archive. Reports, memos and operational reviews.">
<style>
  :root {
    --ink: #1c2530;
    --muted: #5d6b7a;
    --line: #dde3e9;
    --bg: #f6f8fa;
    --brand: #15456b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.5;
  }
  header {
    background: var(--brand);
    color: #fff;
    padding: 18px 24px;
  }
  header .wrap { display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 20px; font-weight: 600; letter-spacing: 0.2px; }
  nav a { color: #cfe0ee; text-decoration: none; margin-left: 22px; font-size: 14px; }
  nav a:hover, nav a:focus { color: #fff; text-decoration: underline; }
  .wrap { max-width: 880px; margin: 0 auto; }
  main { padding: 36px 24px 60px; }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 28px; max-width: 60ch; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border: 1px solid var(--line);
  }
  th, td { text-align: left; padding: 12px 14px; font-size: 14.5px; }
  th { background: #eef2f6; font-weight: 600; border-bottom: 1px solid var(--line); }
  td { border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  td a { color: var(--brand); text-decoration: none; font-weight: 500; }
  td a:hover, td a:focus { text-decoration: underline; }
  .meta { color: var(--muted); white-space: nowrap; }
  footer { border-top: 1px solid var(--line); padding: 20px 24px; color: var(--muted); font-size: 13px; }
  @media (max-width: 600px) {
    .hide-sm { display: none; }
    nav a { margin-left: 14px; }
    header .wrap { flex-direction: column; align-items: flex-start; gap: 8px; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="logo">NovaTech Labs</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Documents</a>
      <a href="#">Contact</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <h1>Document archive</h1>
    <p class="sub">Reports, memos and operational reviews from across the company.</p>

    <table>
      <thead>
        <tr><th>Document</th><th class="hide-sm">Department</th><th>Updated</th><th class="hide-sm">Format</th></tr>
      </thead>
      <tbody>
        <tr>
          <td><a href="Q3_internal_review.docx">Q3 Internal Review</a></td>
          <td class="meta hide-sm">IT Operations</td>
          <td class="meta">30 Sep 2026</td>
          <td class="meta hide-sm">Word</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<footer>
  <div class="wrap">&copy; 2026 NovaTech Labs. All rights reserved.</div>
</footer>
</body>
</html>
